plugins {
    id 'com.android.application'
}

// 发布签名：凭据放在 keystore.properties（已 gitignore），缺失时只影响 release 构建
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// 从发布密钥里算出证书 SHA-256，注入 BuildConfig 供运行时签名校验。
// 好处：换 keystore 时不用改任何代码，校验值自动跟着变。
def signingFingerprint = ""
if (keystorePropertiesFile.exists()) {
    try {
        def keyStore = java.security.KeyStore.getInstance("JKS")
        new File(rootProject.projectDir, keystoreProperties['storeFile']).withInputStream { stream ->
            keyStore.load(stream, keystoreProperties['storePassword'].toCharArray())
        }
        def certificate = keyStore.getCertificate(keystoreProperties['keyAlias'])
        signingFingerprint = java.security.MessageDigest.getInstance("SHA-256")
                .digest(certificate.getEncoded()).encodeHex().toString()
    } catch (Exception e) {
        logger.warn("无法从 keystore 计算签名指纹，release 包将跳过签名校验：" + e.message)
    }
}

android {
    namespace 'com.gpsbt.transfer'
    compileSdk 34
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.gpsshare'
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName '1.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resourceConfigurations += ['zh']
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 调试包不混淆，也不做签名校验（指纹留空 = 跳过校验）
            minifyEnabled false
            buildConfigField "String", "SIGNATURE_SHA256", "\"\""
        }
        release {
            // 打开混淆与资源压缩：这是完整性的第一道门槛，成本为零。
            // 规则见 proguard-rules.pro —— XML 里引用的自定义 View、
            // 清单里注册的组件都必须 keep，否则运行即崩。
            minifyEnabled true
            shrinkResources true
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SIGNATURE_SHA256", "\"${signingFingerprint}\""
        }
    }

    buildFeatures {
        // 签名指纹要经 BuildConfig 传给运行时校验
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            // 项目路径含中文字符，测试 JVM 必须以 UTF-8 读取 classpath，否则 ClassNotFoundException
            systemProperty 'file.encoding', 'UTF-8'
            jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'

    testImplementation 'junit:junit:4.13.2'
}

// 作者专用：按用户的设备码生成校验码。
//
// 放在 test 源集里，**不会被打进 APK**；而且它直接调用 LicenseCode，
// 与客户端是同一份代码，算法不可能漂移。
//
// 用法：
//   ./gradlew -q :app:licenseTool -Pdevice=A7F3-2K9D-8XQ1
//   ./gradlew -q :app:licenseTool -Pdevice=A7F3-2K9D-8XQ1,B2C4-9K7D-3XQ8
tasks.register('licenseTool', JavaExec) {
    group = 'license'
    description = '按设备码生成校验码（作者专用）'
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    // 借用单元测试的运行时 classpath，省得手工拼依赖
    classpath = tasks.named('testDebugUnitTest').get().classpath
    mainClass = 'com.gpsbt.transfer.license.LicenseTool'
    if (project.hasProperty('device')) {
        args project.property('device').toString()
    }
}
