plugins {
    id 'com.android.application'
}

// 发布签名：凭据放在 keystore.properties（已 gitignore），缺失时只影响 release 构建
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.gpsbt.transfer'
    compileSdk 34
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.gpsshare'
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resourceConfigurations += ['zh']
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 调试包不混淆，便于断点调试
            minifyEnabled false
        }
        release {
            // 打开混淆与资源压缩：缩小安装包体积，也减少被反编译后暴露的内部实现。
            // 规则见 proguard-rules.pro —— XML 里引用的自定义 View、
            // 清单里注册的组件都必须 keep，否则运行即崩。
            minifyEnabled true
            shrinkResources true
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            // 项目路径含中文字符，测试 JVM 必须以 UTF-8 读取 classpath，否则 ClassNotFoundException
            systemProperty 'file.encoding', 'UTF-8'
            jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
        }
    }

    packagingOptions {
        resources.excludes += [
                'META-INF/*.version',
                'META-INF/version-control-info.textproto',
                'META-INF/com/android/build/gradle/app-metadata.properties'
        ]
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'

    testImplementation 'junit:junit:4.13.2'
}
