<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS共享 · 校验码生成器（万物皆可买）</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #171d26;
    --line: #263041;
    --text: #e6edf3;
    --dim: #8b98a9;
    --accent: #4ade80;
    --accent-dim: #16653a;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 13px; margin-left: 8px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  textarea, input {
    width: 100%; background: #0c1116; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; font-size: 15px;
    font-family: "Cascadia Mono", Consolas, monospace;
    letter-spacing: 0.5px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent-dim); }
  textarea { min-height: 84px; }
  button {
    background: var(--accent); color: #06240f; border: 0;
    border-radius: 8px; padding: 12px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 14px;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); font-weight: normal;
    padding: 6px 12px; font-size: 12px; margin: 0;
  }
  button.ghost:hover { color: var(--text); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .row label { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  td {
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 14px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: 0; }
  td.dev { color: var(--dim); }
  td.arrow { color: var(--dim); width: 28px; text-align: center; }
  td.code { color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  td.act { width: 64px; text-align: right; }
  .empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  .warn {
    background: #2a1f0a; border: 1px solid #5c4413; color: var(--warn);
    border-radius: 8px; padding: 12px 14px; font-size: 12.5px; margin-top: 16px;
  }
  .meta { color: var(--dim); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>校验码生成器<small>GPS共享 · 万物皆可买</small></h1>
  <div class="sub">把用户发来的设备码粘进下面，生成对应的校验码发回去。设备码在应用的「设置 → 授权」里。</div>

  <div class="card">
    <label for="devices">设备码（每行一个，也可以一行里用逗号隔开）</label>
    <textarea id="devices" placeholder="A7F3-2K9D-8XQ1&#10;B2C4-9K7D-3XQ8"></textarea>
    <button id="go">生成校验码</button>
    <button class="ghost" id="clear" style="margin-left:8px">清空</button>
  </div>

  <div class="card">
    <div class="row">
      <label>结果</label>
      <button class="ghost" id="copyAll">全部复制</button>
    </div>
    <div id="out"><div class="empty">还没有生成。</div></div>
  </div>

  <div class="warn">
    <b>这个文件就是生成凭据，请自己保管好。</b><br>
    它包含生成校验码的密钥——一旦泄露，别人也能生成。不要上传到网盘、聊天群或代码仓库，
    也不要发给客户。丢了可以从工程里重新生成一份（种子见文档）。
  </div>

  <div class="meta">算法与客户端 <code>LicenseCode</code> 完全一致 · 校验码只对生成的设备码有效</div>
</div>

<script>
"use strict";

/* ============================================================
   与 Android 端 app/src/main/java/com/gpsbt/transfer/license/ 下
   DeviceCode.java / LicenseCode.java 逐行对应，改动必须两边同步。
   ============================================================ */

/* 签名指纹导出的种子：换 keystore 后这个值会变，届时需要重新生成本文件。
   取值 = 发布证书 SHA-256 十六进制串的 Java hashCode()。 */
var SEED = -1594574987;

/* 密钥分段常量（与 Java 端一致） */
var PARTS = [0x47505353, 0x48415245, 0x32303236, 0x4B45594D];

/* Crockford Base32：去掉 I / L / O / U */
var ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

/* ---------- SHA-256（纯 JS 实现） ----------
   不用 crypto.subtle：它在 file:// 打开的页面里不可用，
   而这个工具是要双击直接用的。 */
var K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }

function sha256(bytes) {
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var len = bytes.length;
  var total = Math.ceil((len + 9) / 64) * 64;
  var msg = new Uint8Array(total);
  msg.set(bytes);
  msg[len] = 0x80;
  var bitLen = len * 8;
  msg[total - 4] = (bitLen >>> 24) & 0xff;
  msg[total - 3] = (bitLen >>> 16) & 0xff;
  msg[total - 2] = (bitLen >>> 8) & 0xff;
  msg[total - 1] = bitLen & 0xff;

  var w = new Uint32Array(64);
  for (var off = 0; off < total; off += 64) {
    for (var i = 0; i < 16; i++) {
      w[i] = ((msg[off + i*4] << 24) | (msg[off + i*4 + 1] << 16)
            | (msg[off + i*4 + 2] << 8) | msg[off + i*4 + 3]) >>> 0;
    }
    for (var i = 16; i < 64; i++) {
      var s0 = (rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3)) >>> 0;
      var s1 = (rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10)) >>> 0;
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3];
    var e = H[4], f = H[5], g = H[6], h = H[7];
    for (var i = 0; i < 64; i++) {
      var S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
      var ch = ((e & f) ^ (~e & g)) >>> 0;
      var t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      var S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
      var maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
      var t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = [(H[0]+a)>>>0, (H[1]+b)>>>0, (H[2]+c)>>>0, (H[3]+d)>>>0,
         (H[4]+e)>>>0, (H[5]+f)>>>0, (H[6]+g)>>>0, (H[7]+h)>>>0];
  }
  var out = new Uint8Array(32);
  for (var i = 0; i < 8; i++) {
    out[i*4]   = (H[i] >>> 24) & 0xff;
    out[i*4+1] = (H[i] >>> 16) & 0xff;
    out[i*4+2] = (H[i] >>> 8) & 0xff;
    out[i*4+3] = H[i] & 0xff;
  }
  return out;
}

function concat(x, y) {
  var out = new Uint8Array(x.length + y.length);
  out.set(x); out.set(y, x.length);
  return out;
}

function hmacSha256(key, message) {
  var block = 64;
  var k = key.length > block ? sha256(key) : key;
  var padded = new Uint8Array(block);
  padded.set(k);
  var inner = new Uint8Array(block), outer = new Uint8Array(block);
  for (var i = 0; i < block; i++) {
    inner[i] = padded[i] ^ 0x36;
    outer[i] = padded[i] ^ 0x5c;
  }
  return sha256(concat(outer, sha256(concat(inner, message))));
}

/* ---------- 与 Java 端逐行对应的业务逻辑 ---------- */

function secretKey() {
  var key = new Uint8Array(PARTS.length * 4);
  for (var i = 0; i < PARTS.length; i++) {
    key[i*4]   = (PARTS[i] >>> 24) & 0xff;
    key[i*4+1] = (PARTS[i] >>> 16) & 0xff;
    key[i*4+2] = (PARTS[i] >>> 8) & 0xff;
    key[i*4+3] = PARTS[i] & 0xff;
  }
  key[0] ^= SEED & 0xff;
  key[key.length - 1] ^= (SEED >>> 8) & 0xff;
  return key;
}

/* 去分隔符、转大写、纠正易混字符（O→0、I/L→1、丢掉 U） */
function normalize(code) {
  if (!code) return "";
  var upper = String(code).trim().toUpperCase();
  var out = "";
  for (var i = 0; i < upper.length; i++) {
    var c = upper.charAt(i);
    if (c === "-" || c === " " || c === "\t" || c === "\n" || c === "\r") continue;
    if (c === "O") c = "0";
    else if (c === "I" || c === "L") c = "1";
    else if (c === "U") continue;
    out += c;
  }
  return out;
}

function utf8Bytes(text) {
  var out = [], i, c;
  for (i = 0; i < text.length; i++) {
    c = text.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f)); }
    else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f)); }
  }
  return new Uint8Array(out);
}

/* 取摘要的前 length 个 Base32 字符（每字符 5 bit） */
function encode(data, length) {
  var out = "", buffer = 0, bits = 0, index = 0;
  while (out.length < length) {
    if (bits < 5) {
      buffer = (((buffer << 8) | (data[index % data.length] & 0xff)) >>> 0);
      bits += 8;
      index++;
    }
    bits -= 5;
    out += ALPHABET.charAt((buffer >>> bits) & 0x1f);
  }
  return out;
}

function group(value, size) {
  if (!value) return "";
  var out = "";
  for (var i = 0; i < value.length; i++) {
    if (i > 0 && i % size === 0) out += "-";
    out += value.charAt(i);
  }
  return out;
}

/* 校验码 = HMAC-SHA256(设备码, 密钥) 的前 80 位，Base32 成 16 个字符 */
function generateActivationCode(deviceCode) {
  var normalized = normalize(deviceCode);
  if (!normalized) return "";
  var mac = hmacSha256(secretKey(), utf8Bytes(normalized));
  return group(encode(mac, 16), 4);
}

/* ---------- 界面 ----------
   下面这段只在浏览器里跑；node 加载本文件做一致性校验时会跳过。 */
if (typeof document !== "undefined") {
  var input = document.getElementById("devices");
  var out = document.getElementById("out");

  var render = function () {
    var raw = input.value || "";
    var codes = raw.split(/[\s,;、]+/).filter(function (s) { return s.trim() !== ""; });
    if (!codes.length) {
      out.innerHTML = '<div class="empty">还没有生成。</div>';
      return;
    }
    var rows = codes.map(function (code) {
      var device = normalize(code);
      var activation = generateActivationCode(code);
      if (device.length !== 12) {
        return '<tr><td class="dev">' + escapeHtml(device || code) +
               '</td><td class="arrow">!</td><td class="code" style="color:var(--warn)">' +
               '设备码应为 12 位，请核对</td><td class="act"></td></tr>';
      }
      return '<tr><td class="dev">' + escapeHtml(group(device, 4)) +
             '</td><td class="arrow">→</td><td class="code">' + escapeHtml(activation) +
             '</td><td class="act"><button class="ghost" data-copy="' +
             escapeHtml(activation) + '">复制</button></td></tr>';
    });
    out.innerHTML = '<table>' + rows.join("") + '</table>';
  };

  var escapeHtml = function (text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var copyText = function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)["catch"](function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  };

  /* file:// 下 navigator.clipboard 可能不可用，退回 execCommand */
  var fallbackCopy = function (text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) { /* 用户手动选中复制即可 */ }
    document.body.removeChild(area);
  };

  document.getElementById("go").addEventListener("click", render);
  document.getElementById("clear").addEventListener("click", function () {
    input.value = "";
    render();
  });
  document.getElementById("copyAll").addEventListener("click", function () {
    var codes = input.value.split(/[\s,;、]+/).filter(function (s) { return s.trim() !== ""; });
    var lines = codes.map(function (code) {
      return group(normalize(code), 4) + "\t" + generateActivationCode(code);
    });
    copyText(lines.join("\n"));
  });
  out.addEventListener("click", function (e) {
    var target = e.target;
    if (target && target.getAttribute && target.getAttribute("data-copy")) {
      copyText(target.getAttribute("data-copy"));
      var original = target.textContent;
      target.textContent = "已复制";
      setTimeout(function () { target.textContent = original; }, 1200);
    }
  });
  input.addEventListener("input", render);
}

/* 供 node 校验用：确认与 Java 端产出一致 */
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    generateActivationCode: generateActivationCode,
    normalize: normalize,
    group: group,
    SEED: SEED
  };
}
</script>
</body>
</html>
